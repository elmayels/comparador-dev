;gap:16px;flex-wrap:wrap}
.grid.input-mode{grid-template-columns:410px}.grid.input-mode .content{display:none}.grid.results-mode{grid-template-columns:1fr}.grid.results-mode .sidebar{display:none}.result-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.dashboard-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.decision-card{border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(135deg,rgba(66,199,255,.10),rgba(255,255,255,.035))}.decision-card h3{margin:0 0 8px}.decision-card p{margin:0;color:#c6d4ef;line-height:1.55}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:16px;padding:16px}.bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin:10px 0}.bar-label{font-size:12px;color:#c6d4ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#a8d8ff,#c9f2d1)}.bar-value{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.mini-table{width:100%;border-collapse:collapse;font-size:12px}.mini-table th,.mini-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}.mini-table th{color:#c6d4ef;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.chatbox{display:grid;gap:12px}.chat-log{display:grid;gap:10px;max-height:320px;overflow:auto;padding-right:4px}.chat-msg{border-radius:14px;padding:12px 14px;line-height:1.5;font-size:13px}.chat-msg.user{background:rgba(66,199,255,.10);border:1px solid rgba(66,199,255,.22);margin-left:40px}.chat-msg.assistant{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-right:40px}.chat-suggestions{display:flex;gap:8px;flex-wrap:wrap}.chat-suggestions button{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:var(--text);border-radius:999px;padding:8px 10px;cursor:pointer;font-size:12px}.chat-input{display:grid;grid-template-columns:1fr auto;gap:10px}.chat-input textarea{min-height:54px;resize:vertical}

<div id="app"></div>
<script type="module">
import { createApp, computed, reactive } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'

const AUTH_USER = 'admin'
const AUTH_PASS = 'quantia2026'
const API_URL = window.location.origin

window.addEventListener('error', (event) => {
  console.error('Frontend error:', event.error || event.message)
})
window.addEventListener('unhandledrejection', (event) => {
  console.error('Frontend promise rejection:', event.reason)
})

const app = createApp({
  setup() {
    const state = reactive({
      authed: localStorage.getItem('quantia_demo_auth') === '1',
      loginUser: '',
      loginPass: '',
      loginError: '',
      files: [],
      catalogFile: null,
      officialSummaryFile: null,
      project: { proyecto: '', cliente: 'Cliente del proyecto', ubicacion: '' },
      status: { type: 'info', message: '1) Sube el Catálogo / presupuesto base del proyecto para generar Matriz Propuesta IA, o 2) carga cotizaciones para comparar proveedores.' },
      benchmark: { cargado: false },
      preview: null,
      excelBlob: null,
      loading: false,
      filters: { search: '', area: 'Todas', status: 'Todos' },
      pagination: { services: 1, materials: 1, labor: 1, equipment: 1, pageSize: 20 },
      analysis: { mode: null, jobId: null, completed: false, downloadReady: false },
      chat: { question: '', loading: false, messages: [] },
      activeResultTab: 'resumen',
    })

    const benchmarkLoaded = computed(() => !!state.benchmark.cargado)
    const canGenerate = computed(() => (!!state.catalogFile || state.files.length >= 1) && (!state.loading))
    const modeLabel = computed(() => {
      if (state.catalogFile && state.files.length <= 0) return 'Matriz propuesta IA'
      if (state.files.length <= 0) return 'Sin archivos'
      if (state.files.length === 1) return '1 proveedor vs benchmark'
      return `${state.files.length} proveedores + benchmark`
    })
    const buttonLabel = computed(() => {
      if (state.loading) return 'Procesando...'
      if (state.catalogFile && state.files.length === 0) return 'Generar Matriz Propuesta IA'
      return 'Generar comparativo'
    })
    const providerNames = computed(() => state.files.map((f, i) => f.nombre?.trim() || `Proveedor ${i + 1}`))
    const areaOptions = computed(() => ['Todas', ...new Set((state.preview?.rows || []).map(r => r.area || 'General'))])
    const filteredRows = computed(() => {
      let rows = [...(state.preview?.rows || [])]
      const q = state.filters.search.trim().toLowerCase()
      if (q) rows = rows.filter(r => `${r.clave} ${r.descripcion}`.toLowerCase().includes(q))
      if (state.filters.area !== 'Todas') rows = rows.filter(r => (r.area || 'General') === state.filters.area)
      if (state.filters.status !== 'Todos') rows = rows.filter(r => r.status === state.filters.status)
      return rows
    })
    const executive = computed(() => {
      const rows = state.preview?.rows || []
      const providers = state.preview?.provider_scores || []
      return {
        providers: providers.length,
        concepts: rows.length,
        overcosts: rows.filter(r => r.status === 'sobrecoste').length,
        exclusive: rows.filter(r => r.status === 'exclusivo').length,
        belowRef: rows.filter(r => r.status === 'debajo_referencia').length,
        topProvider: providers[0]?.nombre || '—',
      }
    })
    const topInsights = computed(() => {
      const rows = state.preview?.rows || []
      return rows
        .filter(r => r.status === 'sobrecoste' || r.status === 'exclusivo' || r.ahorro)
        .sort((a, b) => (b.ahorro || 0) - (a.ahorro || 0))
        .slice(0, 12)
    })

    const providerRanking = computed(() => {
      const rows = (dashboardSources?.value?.length ? dashboardSources.value : (state.preview?.provider_scores || []))
      return rows.map((row, index) => ({
        ...row,
        rank: index + 1,
        total_oferta: row.total_estimado ?? row.total_oferta ?? row.total_proveedor ?? null,
        total_mercado: row.total_mercado ?? row.mercado_estimado ?? null,
        diferencia: row.diferencia_total ?? row.diferencia ?? null,
        desviacion: row.desviacion_total_pct ?? row.desviacion_pct ?? row.delta_pct ?? null,
      }))
    })

    const pmdRows = computed(() => {
      const cards = state.preview?.executive_analysis || []
      if (cards.length) return cards.map(card => ({
        proveedor: card.provider_name || card.proveedor || 'Proveedor',
        ajuste: card.ajuste_global ?? card.desviacion_total_pct ?? null,
        mercado: card.total_mercado ?? null,
        drivers: card.drivers || [],
        indirectos: card.indirectos_alertas || [],
        texto: card.resumen || card.comentario || null,
      }))
      return topInsights.value.slice(0, 6).map(row => ({
        proveedor: row.ganador || 'Proveedor líder',
        ajuste: row.delta_pct_neodata ?? row.desviacion_total_pct ?? null,
        mercado: row.pu_neodata ?? row.total_mercado ?? null,
        drivers: [{ concepto: row.descripcion, tipo: row.status, impacto: row.ahorro || row.diferencia_total || 0 }],
        indirectos: [],
        texto: null,
      }))
    })

    const dashboardKpis = computed(() => {
      const rows = state.preview?.rows || []
      const providers = providerRanking.value || []
      if (analysisMode.value === 'proposed_matrix' || state.preview?.run_type === 'base_matrix') {
        const base = dashboardSources.value[0] || {}
        return [
          { label: 'Modo', value: 'Matriz base', text: 'Catálogo base usado como mercado.' },
          { label: 'Total', value: formatMoney(base.total), text: base.name || 'Matriz base / Mercado' },
          { label: 'Conceptos', value: base.conceptos || (base.top_items || []).length || '—', text: 'Renglones usados para dashboard.' },
          { label: 'Archivo listo', value: state.excelBlob ? 'Sí' : '—', text: 'Descarga el Excel técnico.' },
        ]
      }
      const best = providers[0]
      const totals = providers.map(p => Number(p.total_oferta ?? p.total_estimado ?? 0)).filter(n => Number.isFinite(n) && n > 0)
      const minTotal = totals.length ? Math.min(...totals) : null
      const maxTotal = totals.length ? Math.max(...totals) : null
      return [
        { label: 'Resultado principal', value: best?.nombre || '—', text: best?.dictamen || 'Lectura del análisis unificado.' },

    function buildFormData() {
      const fd = new FormData()
      state.files.forEach((file, i) => {
        fd.append(`archivo${i + 1}`, file.raw)

          // Campo principal esperado por FastAPI.
          fd.append(`resumen${i + 1}`, file.resumen)
          // Aliases defensivos para evitar regresiones si algun backend anterior queda activo.
          fd.append(`resumen_pu${i + 1}`, file.resumen)
          fd.append(`resumenPu${i + 1}`, file.resumen)
          fd.append(`summary${i + 1}`, file.resumen)
        }
        fd.append(`nombre${i + 1}`, file.nombre || `Proveedor ${i + 1}`)
      })
      if (state.catalogFile) fd.append('catalogo', state.catalogFile)
      if (state.officialSummaryFile) {
        fd.append('resumen_oficial', state.officialSummaryFile)
        fd.append('resumenOficial', state.officialSummaryFile)
      }
      fd.append('proyecto', state.project.proyecto)
      fd.append('cliente', state.project.cliente)
      fd.append('ubicacion', state.project.ubicacion)
      return fd
    }

    async function fetchJsonSafe(url, options = {}) {
      const controller = new AbortController()
      const timeoutMs = options.timeoutMs || 60000
      const timer = setTimeout(() => controller.abort(), timeoutMs)
      try {
        const res = await fetch(url, { ...options, signal: controller.signal })
        const contentType = res.headers.get('content-type') || ''
        const data = contentType.includes('application/json')
          ? await res.json().catch(() => ({}))
          : { detail: await res.text().catch(() => '') }
        if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`)
        return data
      } catch (err) {
        if (err.name === 'AbortError') throw new Error('La solicitud tardó demasiado y fue cancelada por el navegador. Usa Generar Excel; el preview es opcional.')
        if (String(err.message || '').toLowerCase().includes('failed to fetch') || String(err.message || '').toLowerCase().includes('load failed')) {
          throw new Error('No se pudo conectar con el backend de producción. Verifica /health en Railway y vuelve a intentar. El preview no es obligatorio para generar el Excel.')
        }
        throw err
      } finally {
        clearTimeout(timer)
      }
    }

    async function loadPreview() {
      const fd = buildFormData()
      const data = await fetchJsonSafe(`${API_URL}/preview`, { method: 'POST', body: fd, timeoutMs: 30000 })
      state.preview = data
      state.pagination.services = 1
      state.pagination.materials = 1
      state.pagination.labor = 1
    }

    async function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)) }

    async function generate() {
      if (state.catalogFile && state.files.length === 0) {
        state.loading = true
        state.excelBlob = null
        state.status = { type: 'info', message: 'Generando Matriz Propuesta IA desde el catalogo base del proyecto...' }
        try {
          const fd = new FormData()
          fd.append('catalogo', state.catalogFile)
          fd.append('proyecto', state.project.proyecto)
          fd.append('cliente', state.project.cliente)
          fd.append('ubicacion', state.project.ubicacion)
          const res = await fetch(`${API_URL}/api/v2/base-budget/propose-matrix`, { method: 'POST', body: fd })
          const data = await res.json().catch(() => ({}))
          if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`)
          const downloadUrl = data.download_url ? `${API_URL}${data.download_url}` : null
          if (downloadUrl) {
            const dlRes = await fetch(downloadUrl, { cache: 'no-store' })
            if (!dlRes.ok) throw new Error('No se pudo descargar el Excel de matriz base.')
            state.excelBlob = await dlRes.blob()
          }
          state.preview = data.analysis_summary || null
          state.analysis = { mode: 'proposed_matrix', jobId: data.job_id || null, completed: true, downloadReady: true }
          state.activeResultTab = 'resumen'
          state.status = { type: 'success', message: 'Matriz base generada. Dashboard y Excel listos.' }
        } catch (err) {
          state.status = { type: 'error', message: err.message || 'Error generando Matriz Propuesta IA.' }
        } finally {
          state.loading = false
        }
        return
      }
      if (state.files.length < 1) {
        state.status = { type: 'error', message: 'Carga un catalogo base o al menos una cotizacion.' }
        return
      }
      if (state.files.length === 1 && !state.files[0].resumen && !state.officialSummaryFile) {
        state.status = { type: 'error', message: 'Para comparar un solo proveedor necesitas un Resumen PU del proveedor con cantidades reales.' }
        return
      }
      state.loading = true
      state.status = { type: 'info', message: 'Subiendo archivos e iniciando analisis asincrono...' }
      state.excelBlob = null
      try {
        const fd = buildFormData()
        const startRes = await fetch(`${API_URL}/comparar_async`, { method: 'POST', body: fd })
        const startData = await startRes.json().catch(() => ({}))
        if (!startRes.ok) throw new Error(startData.detail || `HTTP ${startRes.status}`)
        const jobId = startData.job_id
        if (!jobId) throw new Error('El backend no devolvio job_id.')

        let job = null
        const started = Date.now()
        const maxMs = 20 * 60 * 1000
        while (Date.now() - started < maxMs) {
          await sleep(2500)
          const pollRes = await fetch(`${API_URL}/jobs/${jobId}`, { cache: 'no-store' })
          job = await pollRes.json().catch(() => ({}))
          if (!pollRes.ok) throw new Error(job.detail || `HTTP ${pollRes.status}`)
          if (job.status === 'error') throw new Error(job.error || 'El proceso fallo en backend.')
          const pct = job.progress != null ? ` (${job.progress}%)` : ''
          const elapsed = job.elapsed_seconds != null ? ` | ${Math.round(job.elapsed_seconds)}s` : ''
          const lastTrace = Array.isArray(job.trace_tail) && job.trace_tail.length ? job.trace_tail[job.trace_tail.length - 1] : null
          const traceMsg = lastTrace && lastTrace.function ? ` | ${lastTrace.event}:${lastTrace.function}` : (lastTrace && lastTrace.event ? ` | ${lastTrace.event}` : '')
          state.status = { type: 'info', message: `Analizando en servidor: ${job.phase || job.status}${pct}${elapsed}${traceMsg}. No cierres esta ventana.` }
          if (job.status === 'done') break
        }
        if (!job || job.status !== 'done') throw new Error('El analisis excedio el tiempo maximo de espera. Revisa /debug/runtime y logs de Railway.')

        const dlRes = await fetch(`${API_URL}/jobs/${jobId}/download`, { cache: 'no-store' })
        if (!dlRes.ok) {
          const data = await dlRes.json().catch(() => ({}))
          throw new Error(data.detail || `No se pudo descargar el Excel del job ${jobId}`)
        }
        state.excelBlob = await dlRes.blob()
        state.analysis = { mode: state.files.length > 1 ? 'multi_provider' : 'single_provider', jobId, analysisId: job.analysis_id || jobId, completed: true, downloadReady: true }
        if (job.analysis_summary && (job.analysis_summary.contractors?.length || job.analysis_summary.rows?.length || job.analysis_summary.provider_scores?.length || job.analysis_summary.critical_concepts?.length)) {
          state.preview = job.analysis_summary
          state.pagination.services = 1
          state.pagination.materials = 1
          state.pagination.labor = 1
        } else {
          loadPreview().catch(err => console.warn('Preview opcional fallo:', err))
        }
        state.activeResultTab = 'resumen'
        state.status = { type: 'success', message: 'Comparativo generado. Ya puedes descargar el Excel técnico.' }
      } catch (err) {
        state.status = { type: 'error', message: err.message || 'Error inesperado.' }
      } finally {
        state.loading = false
      }
    }

    function safeFileName(value) {
      const raw = String(value || 'cotizacion')
      const cleaned = raw
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9._-]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 80) || 'cotizacion'
      return state.catalogFile && state.files.length === 0 ? `Matriz_Propuesta_IA_${cleaned}.xlsx` : `Comparativo_${cleaned}.xlsx`
    }

    function downloadExcel() {
      if (!state.excelBlob) return
      let url = null
      try {
        const blob = state.excelBlob instanceof Blob ? state.excelBlob : new Blob([state.excelBlob], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
        url = (window.URL || window.webkitURL).createObjectURL(blob)
        const a = window.document.createElement('a')
